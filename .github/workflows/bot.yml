name: Bot DEVS

on:
  schedule:
    - cron: "*/30 * * * *"   # de 30 em 30 minutos
  workflow_dispatch:          # botão "Run workflow" para correr à mão
    inputs:
      forcar_dicas:
        description: "Publicar as dicas agora (ignora a hora)"
        type: boolean
        default: false

permissions:
  contents: write             # para guardar o estado.json no repositório

concurrency:
  group: bot-devs
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publicar no Discord
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCAR_DICAS: ${{ inputs.forcar_dicas && '1' || '0' }}
        run: python publicar.py

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "devs-bot"
          git config user.email "devs-bot@users.noreply.github.com"
          git add estado.json
          git diff --staged --quiet || (git commit -m "estado do bot" && git push)
